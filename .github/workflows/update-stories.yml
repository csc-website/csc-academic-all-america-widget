name: Update Academic All-America Stories

on:
  schedule:
    - cron: "37 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Update stories
        run: python scripts/update_stories.py

      - name: Commit changes
        run: |
          git config user.name "CSC Academic All-America Widget"
          git config user.email "actions@users.noreply.github.com"
          git add stories.json
          git diff --cached --quiet || git commit -m "Update Academic All-America stories"
          git push
